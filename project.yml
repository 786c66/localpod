name: LocalPod
options:
  bundleIdPrefix: com.localpod
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  LocalPodKit:
    path: LocalPodKit

targets:
  LocalPod:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocalPod
        excludes:
          - Info.plist
          - Resources/SampleContent
      # Folder reference: keeps "SampleContent" as a directory inside the app
      # bundle so the import pipeline can scan the bundled folder in place.
      - path: LocalPod/Resources/SampleContent
        type: folder
        buildPhase: resources
    dependencies:
      - package: LocalPodKit
        product: LocalPodKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localpod.app
        PRODUCT_NAME: LocalPod
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: LocalPod/Info.plist
      properties:
        CFBundleDisplayName: LocalPod
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true

  LocalPodUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocalPodUITests
    dependencies:
      - target: LocalPod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localpod.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LocalPod

schemes:
  LocalPod:
    build:
      targets:
        LocalPod: all
        LocalPodUITests: [test]
    test:
      config: Debug
      targets:
        - LocalPodUITests
    run:
      config: Debug
    archive:
      config: Release
